<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#0d1111">
    <title>Panel de administración · IcaTurismo</title>
    <link rel="icon" href="../assets/UTP.webp" type="image/webp">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../admin-dashboard/dist/admin-dashboard.css">
    <script src="../js/theme.js"></script>
    <link rel="stylesheet" href="../css/page-loader.css">
    <script src="../js/page-loader.js"></script>
</head>
<body class="admin-page">
    <main class="admin-main" id="adminContent" hidden>
        <div data-admin-dashboard data-admin-authorized="false"></div>
    </main>
    <p class="admin-status" id="adminStatus" role="status" aria-live="polite">Iniciando panel administrativo...</p>
    <button class="admin-retry" id="adminRetry" type="button" hidden>Reintentar conexión</button>

    <script src="../js/config.js" onerror="document.getElementById('adminStatus').textContent = 'No se pudo cargar la configuración de la API.'"></script>
    <script src="../js/auth.js" onerror="document.getElementById('adminStatus').textContent = 'No se pudo cargar el módulo de sesión.'"></script>
    <script type="module" src="../admin-dashboard/dist/admin-dashboard.js" onerror="document.getElementById('adminStatus').textContent = 'No se cargó el dashboard. Verifica que Render compile Frontend/admin-dashboard y publique la carpeta Frontend.'"></script>

    <script>
        (async function () {
            const loginUrl = 'login.html';
            const status = document.getElementById('adminStatus');
            const retryButton = document.getElementById('adminRetry');
            const content = document.getElementById('adminContent');
            const dashboard = document.querySelector('[data-admin-dashboard]');

            dashboard.addEventListener('admin:mounted', function () {
                status.hidden = true;
                content.hidden = false;
            });

            async function verifyAccess() {
                retryButton.hidden = true;
                status.textContent = 'Comprobando la sesión guardada...';

                const controller = new AbortController();
                const slowConnectionMessage = window.setTimeout(function () {
                    status.textContent = 'La API está tardando en iniciar. Render puede tardar unos segundos si el servicio estuvo inactivo...';
                }, 8000);
                const requestTimeout = window.setTimeout(function () {
                    controller.abort();
                }, 60000);

                try {
                    if (!window.Auth) {
                        throw new Error('No se cargó el módulo de sesión (../js/auth.js). Comprueba la pestaña Red del navegador.');
                    }

                    if (!Auth.isLoggedIn()) {
                        window.location.replace(loginUrl);
                        return;
                    }

                    if (!Auth.isStaff()) {
                        alert('Esta página es exclusiva para el equipo de IcaTurismo.');
                        window.location.replace('../index.html');
                        return;
                    }

                    if (!window.API_URL) {
                        throw new Error('No se cargó la dirección de la API (../js/config.js). Comprueba la pestaña Red del navegador.');
                    }

                    status.textContent = 'Conectando con el servidor para validar permisos...';
                    const response = await fetch((window.API_URL || '').replace(/\/$/, '') + '/api/auth/admin/dashboard', {
                        headers: { Authorization: 'Bearer ' + Auth.getToken() },
                        signal: controller.signal,
                    });
                    status.textContent = 'Respuesta recibida. Validando permisos...';
                    const data = await response.json().catch(() => ({}));

                    if (response.status === 401) {
                        Auth.logout();
                        return;
                    }
                    if (response.status === 403) {
                        alert(data.message || 'Esta página es exclusiva para administradores.');
                        window.location.replace('../index.html');
                        return;
                    }
                    if (!response.ok || !data.ok) {
                        throw new Error(data.message || 'No se pudo validar el acceso al panel.');
                    }

                    dashboard.dataset.adminUser = JSON.stringify(data.user);
                    dashboard.dataset.adminAuthorized = 'true';
                    status.textContent = 'Acceso confirmado. Cargando el panel...';
                    dashboard.dispatchEvent(new Event('admin:authorized'));
                } catch (error) {
                    if (error.name === 'AbortError') {
                        status.textContent = 'La API no respondió después de 60 segundos. Comprueba el servicio backend en Render y vuelve a intentarlo.';
                    } else {
                        status.textContent = error.message || 'No se pudo conectar con la API. Comprueba el servicio backend en Render.';
                    }
                    retryButton.hidden = false;
                } finally {
                    window.clearTimeout(slowConnectionMessage);
                    window.clearTimeout(requestTimeout);
                }
            }

            retryButton.addEventListener('click', verifyAccess);
            window.addEventListener('error', function (event) {
                if (!content.hidden) return;
                status.textContent = 'Error del navegador al cargar el panel: ' + (event.message || 'revisa la consola del navegador.');
                retryButton.hidden = false;
            });
            window.addEventListener('unhandledrejection', function (event) {
                if (!content.hidden) return;
                status.textContent = 'Error inesperado al iniciar el panel: ' + (event.reason?.message || 'revisa la consola del navegador.');
                retryButton.hidden = false;
            });

            verifyAccess().catch(function (error) {
                status.textContent = error.message || 'No se pudo iniciar la validación de acceso.';
                retryButton.hidden = false;
            });
        })();
    </script>
</body>
</html>
