<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#0d1111">
    <title>Panel de administración · IcaTurismo</title>
    <link rel="icon" href="../assets/UTP.webp" type="image/webp">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../admin-dashboard/dist/admin-dashboard.css">
    <script src="../js/theme.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script type="module" src="../admin-dashboard/dist/admin-dashboard.js"></script>
</head>
<body class="admin-page">
    <main class="admin-main" id="adminContent" hidden>
        <div data-admin-dashboard data-admin-authorized="false"></div>
    </main>
    <p class="admin-status" id="adminStatus" role="status" aria-live="polite">Verificando acceso...</p>

    <script>
        (async function () {
            const loginUrl = 'login.html';
            const status = document.getElementById('adminStatus');
            const content = document.getElementById('adminContent');
            const dashboard = document.querySelector('[data-admin-dashboard]');

            if (!Auth.isLoggedIn()) {
                window.location.replace(loginUrl);
                return;
            }

            if (!Auth.isAdmin()) {
                alert('Esta página es exclusiva para administradores.');
                window.location.replace('../index.html');
                return;
            }

            try {
                const response = await fetch((window.API_URL || '').replace(/\/$/, '') + '/api/auth/admin/dashboard', {
                    headers: { Authorization: 'Bearer ' + Auth.getToken() },
                });
                const data = await response.json().catch(() => ({}));

                if (response.status === 401) {
                    Auth.logout();
                    return;
                }
                if (response.status === 403) {
                    alert(data.message || 'Esta página es exclusiva para administradores.');
                    window.location.replace('../index.html');
                    return;
                }
                if (!response.ok || !data.ok) {
                    throw new Error(data.message || 'No se pudo validar el acceso al panel.');
                }

                dashboard.dataset.adminUser = JSON.stringify(data.user);
                dashboard.dataset.adminAuthorized = 'true';
                dashboard.dispatchEvent(new Event('admin:authorized'));
                status.hidden = true;
                content.hidden = false;
            } catch (error) {
                status.textContent = error.message || 'No se pudo validar el acceso al panel.';
            }
        })();
    </script>
</body>
</html>
