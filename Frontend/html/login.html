<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · IcaTurismo</title>
    <!-- Estilos solo de login -->
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="icon" href="../assets/UTP.webp" type="image/webp">
    <script src="../js/theme.js"></script>
    <link rel="stylesheet" href="../css/page-loader.css">
    <script src="../js/page-loader.js"></script>
    <script src="../js/i18n-dict.js"></script>
    <script src="../js/i18n-public-dict.js"></script>
    <script src="../js/i18n.js"></script>
</head>
<body class="auth-page">
    <button type="button" class="theme-toggle theme-toggle--floating" data-theme-toggle
        aria-label="Cambiar a modo oscuro" aria-pressed="false" title="Modo oscuro">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>

    <!-- Tarjeta centrada del formulario de login -->
    <div class="auth-card">
        <!-- Logo -->
        <div class="auth-logo">
            <img src="../assets/logoIcaTurismo.svg" alt="IcaTurismo" class="logo-img">
            <p>Promoción de destinos</p>
        </div>

        <h2>Bienvenido de nuevo</h2>
        <p class="subtitle">Inicia sesión para continuar explorando Ica</p>

        <!-- Formulario solo visual (no envía datos) -->
        <form action="#" method="post" >
            <!-- Campo correo -->
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <div class="input-wrap">
                    <span class="icon-left">✉</span>
                    <input type="email" id="email" name="email" placeholder="tu@email.com" autocomplete="email">
                </div>
            </div>

            <!-- Campo contraseña + botón ojo -->
            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-wrap">
                    <span class="icon-left">🔒</span>
                    <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password">
                    <button type="button" class="toggle-pass" id="togglePass" aria-label="Mostrar contraseña">👁</button>
                </div>
            </div>

            <!-- Recordarme / Olvidé contraseña -->
            <div class="form-options">
                <label>
                    <input type="checkbox" name="remember">
                    Recordarme
                </label>
                <a href="#">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn-auth">Iniciar sesión</button>
        </form>

        <!-- Separador y botones sociales (solo visual) -->
        <div class="auth-divider">o continúa con</div>
        <div class="social-btns">
            <button type="button" class="btn-social">
                <span class="g-icon">G</span> Google
            </button>
            <button type="button" class="btn-social">
                <span class="fb-icon">f</span> Facebook
            </button>
        </div>

        <p class="auth-footer">
            ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
        </p>

        <a href="../index.html" class="back-home">← Volver al inicio</a>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        // Mostrar / ocultar contraseña
        const togglePass = document.getElementById('togglePass');
        const passwordInput = document.getElementById('password');
        if (togglePass && passwordInput) {
            togglePass.addEventListener('click', () => {
                const isPass = passwordInput.type === 'password';
                passwordInput.type = isPass ? 'text' : 'password';
                togglePass.textContent = isPass ? '🙈' : '👁';
            });
        }

        // Si ya hay sesión, redirigir según el rol
        if (window.Auth && Auth.isLoggedIn()) {
            window.location.href = Auth.dashboardUrl();
        }

        // Enviar login al backend
        const form = document.querySelector('form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = form.querySelector('.btn-auth');
            const prev = btn.textContent;
            btn.disabled = true;
            btn.textContent = 'Entrando...';
            try {
                await Auth.login(email, password);
                window.location.href = Auth.dashboardUrl();
            } catch (err) {
                alert((window.ICAT_I18N?.t || ((value) => value))(err.message || 'Error al iniciar sesión'));
                btn.disabled = false;
                btn.textContent = prev;
            }
        });
    </script>
</body>
</html>
