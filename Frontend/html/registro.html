<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse · IcaTurismo</title>
    <!-- Estilos solo de registro -->
    <link rel="stylesheet" href="../css/registro.css">
    <link rel="icon" href="UTP.webp" type="image/webp">
</head>
<body class="auth-page">

    <!-- Tarjeta centrada del formulario de registro -->
    <div class="auth-card">
        <!-- Logo -->
        <div class="auth-logo">
            <span class="sun">🌞</span>
            <h1>IcaTurismo</h1>
            <p>Promoción de destinos</p>
        </div>

        <h2>Crea tu cuenta</h2>
        <p class="subtitle">Regístrate y descubre los mejores destinos de Ica</p>

        <!-- Formulario solo visual (no envía datos) -->
        <form action="#" method="post" >
            <!-- Nombre -->
            <div class="form-group">
                <label for="nombre">Nombre completo</label>
                <div class="input-wrap">
                    <span class="icon-left">👤</span>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" autocomplete="name">
                </div>
            </div>

            <!-- Correo -->
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <div class="input-wrap">
                    <span class="icon-left">✉</span>
                    <input type="email" id="email" name="email" placeholder="tu@email.com" autocomplete="email">
                </div>
            </div>

            <!-- Contraseña + ojo -->
            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-wrap">
                    <span class="icon-left">🔒</span>
                    <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
                    <button type="button" class="toggle-pass" id="togglePass" aria-label="Mostrar contraseña">👁</button>
                </div>
            </div>

            <!-- Confirmar contraseña -->
            <div class="form-group">
                <label for="password2">Confirmar contraseña</label>
                <div class="input-wrap">
                    <span class="icon-left">🔒</span>
                    <input type="password" id="password2" name="password2" placeholder="Repite tu contraseña" autocomplete="new-password">
                </div>
            </div>

            <!-- Términos -->
            <div class="form-options">
                <label>
                    <input type="checkbox" name="terms">
                    Acepto los términos y condiciones
                </label>
            </div>

            <button type="submit" class="btn-auth">Crear cuenta</button>
        </form>

        <!-- Separador y botones sociales (solo visual) -->
        <div class="auth-divider">o regístrate con</div>
        <div class="social-btns">
            <button type="button" class="btn-social">
                <span class="g-icon">G</span> Google
            </button>
            <button type="button" class="btn-social">
                <span class="fb-icon">f</span> Facebook
            </button>
        </div>

        <p class="auth-footer">
            ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
        </p>

        <a href="../index.html" class="back-home">← Volver al inicio</a>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        const togglePass = document.getElementById('togglePass');
        const passwordInput = document.getElementById('password');
        if (togglePass && passwordInput) {
            togglePass.addEventListener('click', () => {
                const isPass = passwordInput.type === 'password';
                passwordInput.type = isPass ? 'text' : 'password';
                togglePass.textContent = isPass ? '🙈' : '👁';
            });
        }

        if (window.Auth && Auth.isLoggedIn()) {
            window.location.href = 'index.html';
        }

        const form = document.querySelector('form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('nombre').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const password2 = document.getElementById('password2').value;
            if (password !== password2) {
                alert('Las contraseñas no coinciden');
                return;
            }
            const btn = form.querySelector('.btn-auth');
            const prev = btn.textContent;
            btn.disabled = true;
            btn.textContent = 'Creando cuenta...';
            try {
                await Auth.register(nombre, email, password);
                window.location.href = 'index.html';
            } catch (err) {
                alert(err.message || 'Error al registrarse');
                btn.disabled = false;
                btn.textContent = prev;
            }
        });
    </script>
</body>
</html>
